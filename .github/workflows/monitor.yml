name: Username Monitor

on:
  workflow_dispatch:
    inputs:
      monitor_interval:
        description: 'Check interval (minutes)'
        required: true
        default: '30'
        type: string
      webhook_url:
        description: 'Discord Webhook URL'
        required: false
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max per run

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Run Monitor
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
          MONITOR_INTERVAL: ${{ github.event.inputs.monitor_interval }}
        run: python run_monitor.py
