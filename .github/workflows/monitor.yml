name: Username Monitor

on:
  workflow_dispatch:
    inputs:
      monitor_interval:
        description: 'Check interval (minutes)'
        required: true
        default: '30'
        type: string
      webhook_url:
        description: 'Discord Webhook URL'
        required: false
        type: string
      gen_mode:
        description: 'Generation mode'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - short
          - words
          - mixed
          - leet
      gen_count:
        description: 'Number to generate (if not none)'
        required: true
        default: '0'
        type: string
      gen_length:
        description: 'Generated username length (e.g. 5-7, 3-5, 2-4)'
        required: true
        default: '5-7'
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Run Monitor
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
          MONITOR_INTERVAL: ${{ github.event.inputs.monitor_interval }}
          GEN_MODE: ${{ github.event.inputs.gen_mode }}
          GEN_COUNT: ${{ github.event.inputs.gen_count }}
          GEN_LENGTH: ${{ github.event.inputs.gen_length }}
        run: python run_monitor.py
