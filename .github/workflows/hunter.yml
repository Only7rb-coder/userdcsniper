name: Discord Username Hunter

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'hunt'
        type: choice
        options:
          - hunt
          - monitor
      username_source:
        description: 'Username Source (hunt mode only)'
        required: true
        default: 'generate'
        type: choice
        options: [generate, file, both]
      generate_count:
        description: 'Number to generate (hunt mode)'
        required: true
        default: '5000'
        type: string
      pattern:
        description: 'Generation Pattern'
        required: true
        default: 'mixed'
        type: choice
        options: [short, words, mixed, leet]
      length:
        description: 'Username Length (hunt: 5-7 recommended, monitor: ignored)'
        required: true
        default: '5-7'
        type: string
      concurrency:
        description: 'Concurrency'
        required: true
        default: '50'
        type: choice
        options: ['10', '30', '50', '100']
      timeout:
        description: 'Timeout (seconds)'
        required: true
        default: '10'
        type: choice
        options: ['5', '10', '20']
      webhook_url:
        description: 'Discord Webhook URL'
        required: false
        type: string
      proxy_count:
        description: 'Max Proxies'
        required: true
        default: '80'
        type: string
      monitor_interval:
        description: 'Monitor check interval (minutes, monitor mode only)'
        required: true
        default: '30'
        type: string

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours for monitor mode
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: proxies/
          key: proxies-${{ github.run_id }}
          restore-keys: proxies-
      - run: pip install -r requirements.txt
      - run: mkdir -p results proxies
      
      - name: Run Hunter
        env:
          PYTHONUNBUFFERED: "1"
          MODE: ${{ github.event.inputs.mode }}
          USERNAME_SOURCE: ${{ github.event.inputs.username_source }}
          GENERATE_COUNT: ${{ github.event.inputs.generate_count }}
          PATTERN: ${{ github.event.inputs.pattern }}
          LENGTH: ${{ github.event.inputs.length }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
          PROXY_COUNT: ${{ github.event.inputs.proxy_count }}
          MONITOR_INTERVAL: ${{ github.event.inputs.monitor_interval }}
        run: python run_hunter.py
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-results-${{ github.run_id }}
          path: results/
          retention-days: 7
