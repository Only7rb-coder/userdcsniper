name: Discord Username Hunter

on:
  workflow_dispatch:
    inputs:
      username_source:
        description: 'Username Source'
        required: true
        default: 'generate'
        type: choice
        options: [generate, file, both]
      generate_count:
        description: 'Number to generate'
        required: true
        default: '5000'
        type: string
      pattern:
        description: 'Generation Pattern'
        required: true
        default: 'mixed'
        type: choice
        options: [short, words, mixed, leet]
      length:
        description: 'Username Length (e.g., 2, 2-4, 3+, 5)'
        required: true
        default: '2-32'
        type: string
      concurrency:
        description: 'Concurrency'
        required: true
        default: '50'
        type: choice
        options: ['10', '50', '100']
      timeout:
        description: 'Timeout (seconds)'
        required: true
        default: '10'
        type: choice
        options: ['5', '10', '20']
      webhook_url:
        description: 'Discord Webhook URL (for live notifications)'
        required: false
        type: string
      proxy_count:
        description: 'Max Proxies'
        required: true
        default: '300'
        type: string

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: proxies/
          key: proxies-${{ github.run_id }}
          restore-keys: proxies-
      - run: pip install -r requirements.txt
      - run: mkdir -p results proxies
      
      - name: Run Hunter
        env:
          PYTHONUNBUFFERED: "1"
          USERNAME_SOURCE: ${{ github.event.inputs.username_source }}
          GENERATE_COUNT: ${{ github.event.inputs.generate_count }}
          PATTERN: ${{ github.event.inputs.pattern }}
          LENGTH: ${{ github.event.inputs.length }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
          PROXY_COUNT: ${{ github.event.inputs.proxy_count }}
        run: python run_hunter.py
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-results-${{ github.run_id }}
          path: results/
          retention-days: 7
